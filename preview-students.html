<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نموذج تجريبي — طالبات مداد التجويد</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --cream:#FFF8E1; --surface:#FFFFFF; --surface2:#FFFFFF; --wine:#9A7B1F; --ink:#4A3F1E; --muted:#8F8157; --border:#F5EAC0; --yellow:#FBEBB5; --red:#b8425f; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--cream); color:var(--ink); font-family:'Cairo',sans-serif; min-height:100vh; }
  .switch { position:sticky; top:0; z-index:10; display:flex; gap:0.35rem; padding:0.5rem 0.8rem; background:#fff; border-bottom:1px dashed var(--border); overflow-x:auto; align-items:center; }
  .switch .tag { font-size:0.68rem; color:var(--muted); flex-shrink:0; margin-left:0.3rem; }
  .switch button { flex-shrink:0; padding:0.35rem 0.7rem; border-radius:20px; border:1px solid var(--border); background:var(--cream); color:var(--ink); font-family:'Cairo'; font-size:0.75rem; font-weight:700; cursor:pointer; }
  .switch button.on { background:var(--wine); color:#fff; border-color:var(--wine); }
  .course-topbar { display:flex; align-items:center; gap:0.8rem; padding:1.1rem 1.2rem; border-bottom:1px solid var(--border); background:var(--yellow); }
  .back-btn { background:rgba(255,255,255,0.6); border:none; color:var(--ink); border-radius:10px; padding:0.45rem 0.7rem; font-size:0.9rem; font-family:'Cairo'; font-weight:700; }
  .course-topbar .title { font-weight:800; font-size:1.05rem; color:var(--ink); }
  .wrap { padding:1.1rem 1.2rem 1.5rem; }
  .form-input { background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:0.6rem 0.9rem; font-family:'Cairo'; font-size:0.85rem; color:var(--ink); outline:none; width:100%; }
  .form-input::placeholder { color:var(--muted); }
  .add-btn { width:100%; padding:0.7rem; border-radius:10px; border:none; background:var(--wine); color:#fff; font-family:'Cairo'; font-size:0.88rem; font-weight:700; cursor:pointer; }
  .icon-btn-sm { background:var(--surface); border:1px solid var(--border); color:var(--muted); border-radius:9px; padding:0.35rem 0.8rem; font-family:'Cairo'; font-size:0.76rem; cursor:pointer; }
  .del-btn { background:none; border:none; color:rgba(184,66,95,0.5); cursor:pointer; font-size:0.9rem; padding:0.2rem; }
  .add-student-form { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:1.2rem; margin-bottom:0.9rem; }
  .add-student-form > * { margin-bottom:0.6rem; }
  .add-student-form > *:last-child { margin-bottom:0; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:0.6rem; }
  .btns { display:flex; gap:0.5rem; }
  .btns > * { flex:1; }
  .student-card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:1rem 1.2rem; margin-bottom:0.7rem; }
  .sc-row { display:flex; justify-content:space-between; align-items:flex-start; }
  .sc-name { font-weight:700; margin-bottom:0.2rem; }
  .sc-sub { font-size:0.78rem; color:var(--muted); }
  .sc-act { display:flex; gap:0.4rem; }
  .top-add { margin-bottom:0.9rem; }
  .overlay { position:fixed; inset:0; background:rgba(74,63,30,0.5); display:none; align-items:center; justify-content:center; padding:1.5rem; z-index:5; }
  .overlay.show { display:flex; }
  .modal { background:#fff; border-radius:16px; padding:1.3rem; width:100%; max-width:340px; }
  .modal h3 { font-size:1rem; margin-bottom:0.5rem; }
  .modal p { font-size:0.85rem; color:var(--muted); margin-bottom:1rem; line-height:1.7; }
  .btn-del { padding:0.7rem; border-radius:10px; border:none; background:var(--red); color:#fff; font-family:'Cairo'; font-size:0.88rem; font-weight:700; }
  .hidden { display:none; }
</style>
</head>
<body>
<div class="switch" id="switch">
  <span class="tag">نموذج تجريبي، مو الملف الحقيقي:</span>
  <button data-v="1" class="on">١ الزر يفتح النموذج</button>
  <button data-v="2">٢ المستوى قائمة</button>
  <button data-v="3">٣ المستوى كتابة</button>
  <button data-v="4">٤ تأكيد الحذف</button>
  <button data-v="5">٥ النموذج ثابت</button>
</div>

<div class="course-topbar">
  <button class="back-btn">‹</button>
  <span class="title">👩‍🎓 الطالبات</span>
</div>

<div class="wrap">
  <div id="topAddWrap" class="top-add"><button class="add-btn" id="openForm">+ إضافة طالبة</button></div>

  <div class="add-student-form hidden" id="formBox">
    <input class="form-input" placeholder="اسم الطالبة">
    <div id="fAgeLevelStack">
      <input class="form-input" placeholder="العمر" style="margin-bottom:0.6rem;">
      <select class="form-input" id="levelSelect"><option>المستوى الأول</option></select>
      <input class="form-input hidden" id="levelText" placeholder="المستوى">
    </div>
    <div class="row2 hidden" id="fAgeLevelRow">
      <input class="form-input" placeholder="العمر">
      <select class="form-input"><option>المستوى الأول</option></select>
    </div>
    <div class="btns" id="fBtns">
      <button class="add-btn">حفظ</button>
      <button class="icon-btn-sm" style="padding:0.7rem;">إلغاء</button>
    </div>
    <button class="add-btn hidden" id="fFixedBtn">+ إضافة</button>
  </div>

  <div id="list">
    <div class="student-card"><div class="sc-row"><div><div class="sc-name">اسم الطالبة ١</div><div class="sc-sub">٢٠ سنة · المستوى الأول</div></div><div class="sc-act"><button class="icon-btn-sm">✏️</button><button class="del-btn" onclick="document.getElementById('dlg').classList.add('show')">✕</button></div></div></div>
    <div class="student-card"><div class="sc-row"><div><div class="sc-name">اسم الطالبة ٢</div><div class="sc-sub">٢٥ سنة · المستوى الأول</div></div><div class="sc-act"><button class="icon-btn-sm">✏️</button><button class="del-btn" onclick="document.getElementById('dlg').classList.add('show')">✕</button></div></div></div>
    <div class="student-card"><div class="sc-row"><div><div class="sc-name">اسم الطالبة ٣</div><div class="sc-sub">٣٠ سنة · المستوى الأول</div></div><div class="sc-act"><button class="icon-btn-sm">✏️</button><button class="del-btn" onclick="document.getElementById('dlg').classList.add('show')">✕</button></div></div></div>
  </div>
</div>

<div class="overlay" id="dlg">
  <div class="modal">
    <h3>حذف الطالبة؟</h3>
    <p>راح تنحذف "اسم الطالبة ١" من القائمة.</p>
    <div class="btns"><button class="btn-del">حذف</button><button class="icon-btn-sm" style="padding:0.7rem;" onclick="document.getElementById('dlg').classList.remove('show')">إلغاء</button></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
function show(v) {
  document.querySelectorAll('#switch button').forEach(b => b.classList.toggle('on', b.dataset.v === String(v)));
  $('dlg').classList.remove('show');
  const form = $('formBox'), top = $('topAddWrap');
  $('fAgeLevelStack').classList.remove('hidden'); $('fAgeLevelRow').classList.add('hidden');
  $('fBtns').classList.remove('hidden'); $('fFixedBtn').classList.add('hidden');
  $('levelSelect').classList.remove('hidden'); $('levelText').classList.add('hidden');
  form.classList.add('hidden'); top.classList.remove('hidden');
  if (v == 2) { form.classList.remove('hidden'); top.classList.add('hidden'); }
  if (v == 3) { form.classList.remove('hidden'); top.classList.add('hidden'); $('levelSelect').classList.add('hidden'); $('levelText').classList.remove('hidden'); }
  if (v == 4) { $('dlg').classList.add('show'); }
  if (v == 5) {
    form.classList.remove('hidden'); top.classList.add('hidden');
    $('fAgeLevelStack').classList.add('hidden'); $('fAgeLevelRow').classList.remove('hidden');
    $('fBtns').classList.add('hidden'); $('fFixedBtn').classList.remove('hidden');
  }
}
document.querySelectorAll('#switch button').forEach(b => b.onclick = () => show(b.dataset.v));
$('openForm').onclick = () => { $('formBox').classList.remove('hidden'); $('topAddWrap').classList.add('hidden'); };
</script>
</body>
</html>
