<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>(تجريبي) بوابة طالبات مداد الروح</title>
<meta name="description" content="بوابة طالبات مداد الروح: ادخلي برقمك التعريفي لتشوفي ملخص دورتك وإنجازاتك.">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FBF3F6; --surface: #FFFFFF;
    --wine: #8E4A68; --wine-deep: #6F3A54; --wine-soft: #FBF0F4; --rose: #D9A6BC;
    --ink: #4a3a42; --muted: #A58597; --green: #4E8A68; --red: #b8425f;
    --border: #F0D9E2;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Cairo', sans-serif; background: var(--cream); color: var(--ink); min-height: 100vh; -webkit-text-size-adjust: 100%; }
  .wrap { max-width: 460px; margin: 0 auto; padding: 1.2rem 1rem 2.5rem; }
  .hidden { display: none !important; }

  /* الترحيب */
  .welcome { text-align: center; padding-top: 2.5rem; }
  .brand { display: block; width: 84px; height: 84px; border-radius: 50%; object-fit: contain; margin: 0 auto 1rem; }
  .welcome h1 { font-size: 1.15rem; font-weight: 600; color: var(--wine-deep); margin-bottom: 1.6rem; }
    .login-box label { display: block; font-size: 0.82rem; font-weight: 700; color: var(--wine); margin-bottom: 0.5rem; text-align: right; }
  .code-input:focus { outline: none; border-color: var(--wine); }
  .btn:disabled { opacity: 0.55; }
  .msg { margin-top: 0.7rem; font-size: 0.82rem; color: var(--red); min-height: 1.2rem; }
  .contact { margin-top: 1.3rem; font-size: 0.8rem; color: var(--muted); }
  .contact a { color: var(--wine); font-weight: 700; text-decoration: none; }

  /* صفحة الطالبة */
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.9rem; }
  .topbar .t { font-weight: 600; color: var(--wine-deep); font-size: 0.95rem; }
  .meta { font-size: 0.78rem; color: var(--muted); margin-top: 0.15rem; }
  .sec-title { font-size: 0.78rem; font-weight: 600; color: var(--wine); margin-bottom: 0.35rem; }
  .sec-text { font-size: 0.85rem; line-height: 1.9; white-space: pre-wrap; word-break: break-word; }
  .login-box { background: var(--surface); border: 0.5px solid var(--border); border-radius: 16px; padding: 1.1rem; }
  .code-input { width: 100%; padding: 0.75rem; border: 0.5px solid #EBCFDB; border-radius: 12px; background: #FFFBFC; font-family: 'Cairo'; font-size: 1.05rem; text-align: center; direction: ltr; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink); }
  .btn { width: 100%; margin-top: 0.8rem; padding: 0.7rem; border: none; border-radius: 12px; background: var(--rose); color: #fff; font-family: 'Cairo'; font-size: 0.92rem; font-weight: 600; cursor: pointer; }
  .logout { background: none; border: 0.5px solid #EBCFDB; border-radius: 9px; padding: 0.2rem 0.65rem; font-family: 'Cairo'; font-size: 0.72rem; font-weight: 300; color: var(--muted); cursor: pointer; }
  .card { background: var(--surface); border: 0.5px solid var(--border); border-radius: 16px; padding: 0.85rem 1rem; margin-bottom: 0.7rem; }
  .name { font-size: 1.05rem; font-weight: 600; color: var(--wine-deep); }
  .hdr { display: flex; align-items: center; gap: 0.7rem; margin-bottom: 0.7rem; }
  .av { flex: none; width: 52px; height: 52px; border-radius: 50%; background: #F3DCE5; color: var(--wine); display: flex; align-items: center; justify-content: center; font-size: 1.3rem; font-weight: 600; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; margin-bottom: 0.7rem; }
  .tile { background: var(--surface); border: 0.5px solid var(--border); border-radius: 16px; padding: 0.7rem 0.8rem; }
  .tile.att { background: #EEF7F1; border-color: #DCEBE1; }
  .tl { font-size: 0.75rem; color: var(--muted); margin-bottom: 0.2rem; }
  .tv { font-size: 1.15rem; font-weight: 600; color: var(--wine-deep); }
  .tile.att .tv { color: var(--green); }
  .tile.last { background: #EAF4FB; border-color: #D6E8F4; }
  .tile.last .tv { color: #3F6E94; }
  .c-plan { background: #FCEEF3; border-color: #F4D8E3; }
  .c-note { background: #FFF8E1; border-color: #F5EAC0; }
  #docToggle { background: #E6F6F5; border-color: #CBE9E6; color: #3A7F7B; }
  #docCard { background: #E6F6F5; border-color: #CBE9E6; }
  #docCard .sec-title:not(:first-child) { margin-top: 0.7rem; }
  #svToggle { background: #FFF0E6; border-color: #F8DCC6; color: #A5663A; }
  #surveyCard { background: #FFF0E6; border-color: #F8DCC6; }
  #surveyCard .qt { color: #8A5530; }
  .svtoggle { display: block; width: 100%; margin-bottom: 0.7rem; padding: 0.7rem; border-radius: 12px; border: 0.5px solid #EBCFDB; background: var(--surface); color: var(--wine); font-family: 'Cairo'; font-size: 0.88rem; font-weight: 600; cursor: pointer; }
  .closing { text-align: center; background: #F6EEF9; color: #6F4A80; border-color: #EBDDF1; font-weight: 400; line-height: 1.9; font-size: 0.88rem; }
  .sec-title.big { font-size: 0.95rem; margin-bottom: 0.5rem; }
  .hrow { display: flex; align-items: center; gap: 0.7rem; padding: 0.5rem 0; border-top: 0.5px solid var(--border); font-size: 0.8rem; }
  .hrow .hc { flex: none; width: 2.8rem; text-align: center; color: var(--wine); font-weight: 600; }
  .hrow .hh { flex: 1; min-width: 0; color: var(--ink); line-height: 1.6; word-break: break-word; }
  .hrow .ha { flex: none; width: 4.2rem; text-align: center; color: var(--green); font-weight: 600; }
  .hrow .cn { display: inline-flex; align-items: center; justify-content: center; width: 2rem; height: 2rem; border-radius: 50%; background: var(--wine-soft); }
  .hrow.hhead { border-top: none; padding: 0 0 0.3rem; font-size: 0.68rem; }
  .hrow.hhead > div { color: var(--muted); font-weight: 300; }
  .doc { display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 0.2rem; border-top: 0.5px solid var(--border); text-decoration: none; color: var(--ink); font-size: 0.85rem; }
  .doc .dl { color: var(--wine); }
  .q { margin-bottom: 0.55rem; }
  .q .qt { font-size: 0.8rem; font-weight: 600; color: var(--ink); margin-bottom: 0.3rem; }
  .opts { display: flex; gap: 0.3rem; }
  .opt { flex: 1; text-align: center; padding: 0.32rem 0.1rem; border: 0.5px solid #EBCFDB; border-radius: 9px; background: #fff; font-family: 'Cairo'; font-size: 0.72rem; font-weight: 400; color: var(--wine); cursor: pointer; white-space: nowrap; }
  .opt.on { background: var(--rose); color: #fff; border-color: var(--rose); }
  textarea { width: 100%; min-height: 54px; padding: 0.5rem; border: 0.5px solid #EBCFDB; border-radius: 10px; font-family: 'Cairo'; font-size: 0.8rem; background: #FFFBFC; resize: vertical; color: var(--ink); }
  .store { display: block; text-align: center; text-decoration: none; padding: 0.7rem; border-radius: 12px; border: 0.5px solid var(--rose); color: var(--wine); font-weight: 600; font-size: 0.88rem; background: var(--surface); }
  .row-sep { border-top: 1px dashed var(--border); margin: 0.7rem 0; }
  .empty { font-size: 0.82rem; color: var(--muted); }
  textarea:focus { outline: none; border-color: var(--wine); }
  .chk { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.5rem; font-size: 0.8rem; color: var(--ink); cursor: pointer; }
  .chk input { width: 18px; height: 18px; accent-color: var(--wine); }
  .hint { font-size: 0.72rem; color: var(--muted); margin-top: 0.25rem; }
  .thanks { text-align: center; color: var(--green); font-weight: 700; font-size: 0.9rem; }
  .foot { text-align: center; font-size: 0.75rem; color: var(--muted); margin-top: 1rem; }
  .foot a { color: var(--wine); text-decoration: none; font-weight: 700; }
</style>
</head>

    <div class="login-box">

      <input id="codeInput" class="code-input" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" >

</div>

<script>
const SUPABASE_URL = 'https://btosiqsrpvrjajwhyrph.supabase.co';
const SUPABASE_KEY = 'sb_publishable_-YU0y8Hdj6N_sPKRRtYYoA_PdJ2q7Po';
const STORE_URL = 'https://medadalrooh.com';
const WA_NUMBER = '96876727387';
const WA_URL = 'https://wa.me/' + WA_NUMBER;

const SURVEY = [
  { id: 'overall', title: 'رضاك العام عن الدورة', opts: [['very', 'راضية جدًا'], ['ok', 'راضية'], ['improve', 'تحتاج تحسين']] },
  { id: 'followup', title: 'المتابعة والتنظيم', opts: [['excellent', 'ممتاز'], ['good', 'جيد'], ['improve', 'يحتاج تحسين']] },
  { id: 'load', title: 'حجم المقرر والوقت', opts: [['suitable', 'مناسب'], ['much', 'كثير'], ['little', 'قليل']] },
];

let currentCode = '';
let answers = {};

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function toAr(n) { return String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]); }
function $(id) { return document.getElementById(id); }

document.getElementById('waLink1').href = WA_URL;

async function rpc(fn, args) {
  const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + fn, {
    method: 'POST',
    headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(args),
  });
  if (!res.ok) throw new Error('http ' + res.status);
  return res.json();
}

function extractCode(text) {
  const m = String(text || '').toUpperCase().match(/MS\d{4}-?\d{3}-?[A-Z0-9]{4}/);
  return m ? m[0] : String(text || '').trim();
}

async function login(saved) {
  const raw = saved || extractCode($('codeInput').value);
  const msg = $('loginMsg');
  msg.textContent = '';
  if (!raw) { msg.textContent = 'اكتبي الرقم التعريفي'; return; }
  const btn = $('loginBtn');
  btn.disabled = true; btn.textContent = '...';
  try {
    const r = await rpc('get_student_page', { p_code: raw });
    if (r.status === 'ok') {
      currentCode = raw;
      answers = {};
      try { sessionStorage.setItem('madad_code', raw); } catch (e) {}
      history.replaceState({ in: 1 }, '');
      history.pushState({ in: 1 }, '');
      renderPortal(r.payload, !!r.survey_done);
      $('welcome').classList.add('hidden');
      $('portal').classList.remove('hidden');
      $('codeInput').value = '';
      window.scrollTo(0, 0);
    } else if (r.status === 'locked') {
      msg.textContent = 'محاولات كثيرة، جرّبي بعد عشر دقائق.';
    } else {
      if (saved) { try { sessionStorage.removeItem('madad_code'); } catch (e) {} }
      msg.textContent = 'الرقم غير صحيح، تأكدي منه وحاولي مرة ثانية.';
    }
  } catch (e) {
    msg.textContent = 'تعذّر الاتصال، تأكدي من الإنترنت وحاولي مرة ثانية.';
  }
  btn.disabled = false; btn.textContent = 'دخول';
}

function logout() {
  currentCode = ''; answers = {};
  try { sessionStorage.removeItem('madad_code'); } catch (e) {}
  $('portal').innerHTML = '';
  $('portal').classList.add('hidden');
  $('welcome').classList.remove('hidden');
}

function renderPortal(p, surveyDone) {
  const top = `<div class="topbar"><div class="t">🎙️ مداد التلقين</div><button class="logout" onclick="logout()">خروج</button></div>`;
  const L = p.last;
  const attTxt = L.att != null ? toAr(L.att) + '٪' : '—';
  const star = L.star ? ` <span class="star">🌟</span>` : '';
  let html = top;

  const initial = String(p.display || p.name || '').trim().charAt(0);
  html += `<div class="hdr"><div class="av">${esc(initial)}</div><div><div class="name">أهلًا ${esc(p.display || p.name)}</div>${p.joinCycle ? `<div class="meta">${esc(p.joinEmoji || '')} دورة الانضمام: دورة ${toAr(p.joinCycle)}</div>` : ''}</div></div>`;

  html += `<div class="tiles">
    <div class="tile last"><div class="tl">آخر دورة</div><div class="tv">${L.emoji ? esc(L.emoji) + ' ' : ''}دورة ${toAr(L.cycle)}</div></div>
    <div class="tile att"><div class="tl">نسبة الحضور</div><div class="tv">${attTxt}${star}</div></div>
  </div>`;

  let plan = `<div class="sec-title">📖 مقرر الحفظ</div><div class="sec-text">${L.hifz ? esc(L.hifz) : '<span class="empty">—</span>'}</div>`;
  if (L.kubra) plan += `<div class="row-sep"></div><div class="sec-title">⭐️ المراجعة الكبرى</div><div class="sec-text">${esc(L.kubra)}</div>`;
  if (L.taahud) plan += `<div class="row-sep"></div><div class="sec-title">♾️ التعاهد</div><div class="sec-text">${esc(L.taahud)}</div>`;
  html += `<div class="card c-plan">${plan}</div>`;

  if (L.note) html += `<div class="card c-note"><div class="sec-title">📝 ملاحظات المعلمة</div><div class="sec-text">${esc(L.note)}</div></div>`;

  const docs = Array.isArray(p.docs) ? p.docs : [];
  const docCycles = [...new Set(docs.map(d => d.cycle))];
  html += `<button type="button" class="svtoggle" id="docToggle">📄 المستندات</button>
    <div class="card hidden" id="docCard">` + (docs.length
    ? docCycles.map(c => `<div class="sec-title">دورة ${toAr(c)}</div>` + docs.filter(d => d.cycle === c).map(d => `<a class="doc" href="${esc(d.url)}" target="_blank" rel="noopener"><span>${esc(d.title)}</span><span class="dl">⬇️</span></a>`).join('')).join('')
    : `<div class="empty">لا توجد مستندات حاليًا</div>`) + `</div>`;

  const hist = Array.isArray(p.history) ? p.history : [];
  if (hist.length) {
    html += `<div class="card"><div class="sec-title big">🗂️ الدورات السابقة</div>
      <div class="hrow hhead"><div class="hc">الدورة</div><div class="hh">المقرر</div><div class="ha">نسبة الحضور</div></div>` +
      hist.map(h => `<div class="hrow"><div class="hc"><span class="cn">${toAr(h.cycle)}</span></div><div class="hh">${h.hifz ? esc(h.hifz) : '—'}</div><div class="ha">${h.att != null ? toAr(h.att) + '٪' : '—'}</div></div>`).join('') +
      `</div>`;
  }

  html += `<div class="card closing">سعدنا بوجودك معنا يا ${esc(p.first || p.display || p.name)} في هذه الدورة،<br>ونلقاك في الدورة القادمة بإذن الله 🤍</div>`;

  html += surveyDone
    ? `<div class="card"><div class="thanks">وصل رأيك، جزاك الله خيرًا 🤍</div></div>`
    : `<button type="button" class="svtoggle" id="svToggle">💬 شاركينا رأيك</button>
      <div class="card hidden" id="surveyCard">
        <div class="hint" style="margin-bottom:0.6rem;">الجزء الأول يوصل باسمك.</div>
        ${SURVEY.map(q => `<div class="q"><div class="qt">${q.title}</div><div class="opts">${q.opts.map(o => `<button type="button" class="opt" data-q="${q.id}" data-v="${o[0]}">${o[1]}</button>`).join('')}</div></div>`).join('')}
        <div class="q"><div class="qt">رأيك عن الدورة (اختياري)</div><textarea id="svComment" maxlength="1000"></textarea></div>
        <div class="row-sep"></div>
        <div class="q"><div class="qt">اقتراح أو ملاحظة (اختياري)</div>
          <textarea id="svSugg" maxlength="2000"></textarea>
          <label class="chk"><input type="checkbox" id="svShowName"> اجعلي اسمي ظاهرًا مع اقتراحي</label>
          <div class="hint">لو ما حددتي الخيار، يوصل اقتراحك بدون اسم.</div>
        </div>
        <button class="btn" id="svBtn" type="button">إرسال</button>
        <div class="msg" id="svMsg"></div>
      </div>`;

  html += `<a class="store" href="${STORE_URL}" target="_blank" rel="noopener">🛒 متجر مداد الروح</a>` + footer();
  $('portal').innerHTML = html;

  document.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
    const off = answers[b.dataset.q] === b.dataset.v;
    if (off) delete answers[b.dataset.q]; else answers[b.dataset.q] = b.dataset.v;
    document.querySelectorAll('.opt[data-q="' + b.dataset.q + '"]').forEach(x => x.classList.toggle('on', !off && x === b));
  }));
  const dt = $('docToggle');
  if (dt) dt.addEventListener('click', () => { $('docCard').classList.toggle('hidden'); });
  const tg = $('svToggle');
  if (tg) tg.addEventListener('click', () => { tg.classList.add('hidden'); $('surveyCard').classList.remove('hidden'); });
  const sb = $('svBtn');
  if (sb) sb.addEventListener('click', submitSurvey);
}

function footer() {
  return `<div class="foot">للتواصل: <a href="${WA_URL}" target="_blank" rel="noopener">إدارة مداد الروح</a></div>`;
}

async function submitSurvey() {
  const msg = $('svMsg');
  msg.style.color = 'var(--red)';
  if (!answers.overall || !answers.followup || !answers.load) { msg.textContent = 'اختاري إجابة لكل سؤال من الأسئلة الثلاثة'; return; }
  const btn = $('svBtn');
  btn.disabled = true; btn.textContent = '...';
  try {
    const r = await rpc('submit_survey', {
      p_code: currentCode,
      p_overall: answers.overall, p_followup: answers.followup, p_load: answers.load,
      p_comment: $('svComment').value, p_suggestion: $('svSugg').value,
      p_show_name: $('svShowName').checked,
    });
    if (r.status === 'ok' || r.status === 'already') {
      $('surveyCard').innerHTML = '<div class="thanks">' + (r.status === 'ok' ? 'وصل رأيك، جزاك الله خيرًا 🤍' : 'وصلنا رأيك سابقًا، جزاك الله خيرًا 🤍') + '</div>';
      return;
    }
    msg.textContent = r.status === 'locked' ? 'محاولات كثيرة، جرّبي بعد عشر دقائق.' : 'تعذّر الإرسال، حاولي مرة ثانية.';
  } catch (e) {
    msg.textContent = 'تعذّر الاتصال، حاولي مرة ثانية.';
  }
  btn.disabled = false; btn.textContent = 'إرسال';
}

$('loginBtn').addEventListener('click', () => login());
$('codeInput').value = '';
$('codeInput').addEventListener('focus', e => e.target.select());
$('codeInput').addEventListener('paste', e => {
  e.preventDefault();
  const t = (e.clipboardData || window.clipboardData).getData('text');
  $('codeInput').value = extractCode(t);
});
window.addEventListener('popstate', () => { if (currentCode) history.pushState({ in: 1 }, ''); });

if (location.hash !== '#login') {
$('welcome').classList.add('hidden'); $('portal').classList.remove('hidden');
renderPortal({v:1,ready:true,name:'سارة أحمد علي العتيبي',display:'سارة أحمد',first:'سارة',joinCycle:3,joinEmoji:'🎈',last:{cycle:7,emoji:'🍎',att:100,star:true,hifz:'البقرة ٢٥ - ٣٠',kubra:'سورة النساء',taahud:'جزء عم',note:'ماشاء الله، استمري على هذا المستوى.'},history:[{cycle:6,hifz:'البقرة ١ - ٢٥',att:96,star:false},{cycle:5,hifz:'الفاتحة وأول البقرة',att:100,star:true},{cycle:4,hifz:'مراجعة جزء عم',att:88,star:false}],docs:[{cycle:7,title:'شهادة تميز',url:'#'},{cycle:7,title:'شهادة ختام',url:'#'},{cycle:6,title:'شهادة ختام',url:'#'}]}, false);
}
$('codeInput').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
</script>
