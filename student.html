<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بوابة طالبات مداد الروح</title>
<meta name="description" content="بوابة طالبات مداد الروح: ادخلي برقمك التعريفي لتشوفي ملخص دورتك وإنجازاتك.">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #F7EDE1; --surface: #FFFBF4; --surface2: #F1E4D5;
    --wine: #833D5A; --wine-deep: #6F2A46; --wine-soft: rgba(131,61,90,0.08);
    --ink: #2d2030; --muted: #8a7286; --green: #2e7d5a; --red: #b8425f;
    --border: rgba(131,61,90,0.16);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Cairo', sans-serif; background: var(--cream); color: var(--ink); min-height: 100vh; -webkit-text-size-adjust: 100%; }
  .wrap { max-width: 460px; margin: 0 auto; padding: 1.2rem 1rem 2.5rem; }
  .hidden { display: none !important; }

  /* الترحيب */
  .welcome { text-align: center; padding-top: 2.5rem; }
  .brand { width: 84px; height: 84px; border-radius: 50%; background: var(--wine); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 2.4rem; margin: 0 auto 1rem; box-shadow: 0 6px 18px rgba(131,61,90,0.25); }
  .welcome h1 { font-size: 1.25rem; font-weight: 900; color: var(--wine-deep); margin-bottom: 0.3rem; }
  .welcome .sub { font-size: 0.85rem; color: var(--muted); margin-bottom: 1.6rem; }
  .login-box { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 1.1rem; }
  .login-box label { display: block; font-size: 0.82rem; font-weight: 700; color: var(--wine); margin-bottom: 0.5rem; text-align: right; }
  .code-input { width: 100%; padding: 0.8rem; border: 1.5px solid var(--border); border-radius: 12px; background: #fff; font-family: 'Cairo'; font-size: 1.05rem; text-align: center; direction: ltr; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink); }
  .code-input:focus { outline: none; border-color: var(--wine); }
  .btn { width: 100%; margin-top: 0.8rem; padding: 0.8rem; border: none; border-radius: 12px; background: var(--wine); color: #fff; font-family: 'Cairo'; font-size: 0.95rem; font-weight: 800; cursor: pointer; }
  .btn:disabled { opacity: 0.55; }
  .msg { margin-top: 0.7rem; font-size: 0.82rem; color: var(--red); min-height: 1.2rem; }
  .contact { margin-top: 1.3rem; font-size: 0.8rem; color: var(--muted); }
  .contact a { color: var(--wine); font-weight: 700; text-decoration: none; }

  /* صفحة الطالبة */
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.9rem; }
  .topbar .t { font-weight: 900; color: var(--wine-deep); font-size: 0.95rem; }
  .logout { background: none; border: 1px solid var(--border); border-radius: 10px; padding: 0.3rem 0.7rem; font-family: 'Cairo'; font-size: 0.75rem; color: var(--muted); cursor: pointer; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 1rem; margin-bottom: 0.8rem; }
  .name { font-size: 1.15rem; font-weight: 900; color: var(--wine-deep); }
  .meta { font-size: 0.8rem; color: var(--muted); margin-top: 0.25rem; line-height: 1.8; }
  .att { display: flex; align-items: center; justify-content: space-between; }
  .att .lbl { font-size: 0.85rem; color: var(--muted); font-weight: 600; }
  .att .val { font-size: 1.6rem; font-weight: 900; color: var(--green); }
  .att .star { font-size: 1.3rem; margin-inline-start: 0.35rem; }
  .sec-title { font-size: 0.82rem; font-weight: 800; color: var(--wine); margin-bottom: 0.35rem; }
  .sec-text { font-size: 0.92rem; line-height: 1.9; white-space: pre-wrap; word-break: break-word; }
  .row-sep { border-top: 1px dashed var(--border); margin: 0.7rem 0; }
  .empty { font-size: 0.82rem; color: var(--muted); }
  table { width: 100%; table-layout: fixed; border-collapse: collapse; font-size: 0.76rem; }
  th { background: var(--wine-soft); color: var(--wine); font-weight: 800; padding: 0.4rem 0.25rem; }
  td { padding: 0.45rem 0.25rem; border-top: 1px solid var(--border); text-align: center; word-break: break-word; vertical-align: middle; }
  th:nth-child(1), td:nth-child(1) { width: 17%; }
  th:nth-child(3), td:nth-child(3) { width: 19%; }
  th:nth-child(4), td:nth-child(4) { width: 19%; }
  .closing { text-align: center; background: var(--wine); color: #fff; border: none; font-weight: 700; line-height: 1.9; font-size: 0.92rem; }
  .q { margin-bottom: 0.9rem; }
  .q .qt { font-size: 0.85rem; font-weight: 700; margin-bottom: 0.4rem; }
  .opts { display: flex; gap: 0.4rem; flex-wrap: wrap; }
  .opt { flex: 1 1 28%; text-align: center; padding: 0.5rem 0.3rem; border: 1.5px solid var(--border); border-radius: 10px; background: #fff; font-family: 'Cairo'; font-size: 0.8rem; color: var(--ink); cursor: pointer; }
  .opt.on { background: var(--wine); color: #fff; border-color: var(--wine); font-weight: 700; }
  textarea { width: 100%; min-height: 78px; padding: 0.6rem; border: 1.5px solid var(--border); border-radius: 12px; font-family: 'Cairo'; font-size: 0.85rem; background: #fff; resize: vertical; color: var(--ink); }
  textarea:focus { outline: none; border-color: var(--wine); }
  .chk { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.5rem; font-size: 0.8rem; color: var(--ink); cursor: pointer; }
  .chk input { width: 18px; height: 18px; accent-color: var(--wine); }
  .hint { font-size: 0.72rem; color: var(--muted); margin-top: 0.25rem; }
  .thanks { text-align: center; color: var(--green); font-weight: 700; font-size: 0.9rem; }
  .store { display: block; text-align: center; text-decoration: none; padding: 0.8rem; border-radius: 12px; border: 1.5px solid var(--wine); color: var(--wine); font-weight: 800; font-size: 0.92rem; background: var(--surface); }
  .foot { text-align: center; font-size: 0.75rem; color: var(--muted); margin-top: 1rem; }
  .foot a { color: var(--wine); text-decoration: none; font-weight: 700; }
</style>
</head>
<body>
<div class="wrap">

  <!-- صفحة الترحيب -->
  <div id="welcome" class="welcome">
    <div class="brand">📖</div>
    <h1>أهلًا بك في بوابة طالبات مداد الروح</h1>
    <div class="sub">ادخلي برقمك التعريفي</div>
    <div class="login-box">
      <label for="codeInput">الرقم التعريفي</label>
      <input id="codeInput" class="code-input" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="MS0000-000-XXXX">
      <button id="loginBtn" class="btn" type="button">دخول</button>
      <div id="loginMsg" class="msg"></div>
    </div>
    <div class="contact">ما وصلك الرقم؟ <a id="waLink1" target="_blank" rel="noopener">تواصلي معنا على واتساب</a></div>
  </div>

  <!-- صفحة الطالبة -->
  <div id="portal" class="hidden"></div>

</div>

<script>
const SUPABASE_URL = 'https://btosiqsrpvrjajwhyrph.supabase.co';
const SUPABASE_KEY = 'sb_publishable_-YU0y8Hdj6N_sPKRRtYYoA_PdJ2q7Po';
const STORE_URL = 'https://medadalrooh.com';
const WA_NUMBER = '96876727387';
const WA_URL = 'https://wa.me/' + WA_NUMBER;

const SURVEY = [
  { id: 'overall', title: 'رضاك العام عن الدورة', opts: [['very', 'راضية جدًا'], ['ok', 'راضية'], ['improve', 'تحتاج تحسين']] },
  { id: 'followup', title: 'المتابعة والتنظيم', opts: [['excellent', 'ممتاز'], ['good', 'جيد'], ['improve', 'يحتاج تحسين']] },
  { id: 'load', title: 'حجم المقرر والوقت', opts: [['suitable', 'مناسب'], ['much', 'كثير'], ['little', 'قليل']] },
];

let currentCode = '';
let answers = {};

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function toAr(n) { return String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]); }
function firstTwo(name) { return String(name || '').trim().split(/\s+/).slice(0, 2).join(' '); }
function $(id) { return document.getElementById(id); }

document.getElementById('waLink1').href = WA_URL;

async function rpc(fn, args) {
  const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + fn, {
    method: 'POST',
    headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(args),
  });
  if (!res.ok) throw new Error('http ' + res.status);
  return res.json();
}

async function login() {
  const raw = $('codeInput').value.trim();
  const msg = $('loginMsg');
  msg.textContent = '';
  if (!raw) { msg.textContent = 'اكتبي الرقم التعريفي'; return; }
  const btn = $('loginBtn');
  btn.disabled = true; btn.textContent = '...';
  try {
    const r = await rpc('get_student_page', { p_code: raw });
    if (r.status === 'ok') {
      currentCode = raw;
      answers = {};
      renderPortal(r.payload, !!r.survey_done);
      $('welcome').classList.add('hidden');
      $('portal').classList.remove('hidden');
      $('codeInput').value = '';
      window.scrollTo(0, 0);
    } else if (r.status === 'locked') {
      msg.textContent = 'محاولات كثيرة، جرّبي بعد عشر دقائق.';
    } else {
      msg.textContent = 'الرقم غير صحيح، تأكدي منه وحاولي مرة ثانية.';
    }
  } catch (e) {
    msg.textContent = 'تعذّر الاتصال، تأكدي من الإنترنت وحاولي مرة ثانية.';
  }
  btn.disabled = false; btn.textContent = 'دخول';
}

function logout() {
  currentCode = ''; answers = {};
  $('portal').innerHTML = '';
  $('portal').classList.add('hidden');
  $('welcome').classList.remove('hidden');
}

function renderPortal(p, surveyDone) {
  const top = `<div class="topbar"><div class="t">📖 مداد الروح</div><button class="logout" onclick="logout()">خروج</button></div>`;
  if (!p.ready) {
    $('portal').innerHTML = top + `
      <div class="card"><div class="name">${esc(p.name)}</div>
      <div class="meta">صفحتك بتتوفر بعد انتهاء دورتك الأولى بإذن الله 🤍</div></div>` + footer();
    return;
  }
  const L = p.last;
  const first = firstTwo(p.name);
  const attTxt = L.att != null ? toAr(L.att) + '٪' : '—';
  const star = L.star ? `<span class="star">${esc(L.starEmoji || '⭐')}</span>` : '';
  let html = top;

  html += `<div class="card">
    <div class="name">${esc(p.name)}</div>
    <div class="meta">${p.joinCycle ? `${esc(p.joinEmoji || '')} دورة الانضمام: دورة ${toAr(p.joinCycle)}<br>` : ''}📘 آخر دورة: دورة ${toAr(L.cycle)}</div>
  </div>`;

  html += `<div class="card"><div class="att"><span class="lbl">نسبة الحضور</span><span><span class="val">${attTxt}</span>${star}</span></div></div>`;

  let plan = `<div class="sec-title">📖 مقرر الحفظ</div><div class="sec-text">${L.hifz ? esc(L.hifz) : '<span class="empty">—</span>'}</div>`;
  if (L.kubra) plan += `<div class="row-sep"></div><div class="sec-title">🔁 المراجعة الكبرى</div><div class="sec-text">${esc(L.kubra)}</div>`;
  if (L.taahud) plan += `<div class="row-sep"></div><div class="sec-title">♾️ التعاهد</div><div class="sec-text">${esc(L.taahud)}</div>`;
  html += `<div class="card">${plan}</div>`;

  if (L.note) html += `<div class="card"><div class="sec-title">📝 ملاحظات المعلمة</div><div class="sec-text">${esc(L.note)}</div></div>`;

  const docs = Array.isArray(p.docs) ? p.docs : [];
  html += `<div class="card"><div class="sec-title">📄 المستندات</div>` + (docs.length
    ? docs.map(d => `<div class="sec-text"><a href="${esc(d.url)}" target="_blank" rel="noopener">${esc(d.title)}</a></div>`).join('')
    : `<div class="empty">لا توجد مستندات حاليًا</div>`) + `</div>`;

  const hist = Array.isArray(p.history) ? p.history : [];
  if (hist.length) {
    html += `<div class="card"><div class="sec-title">🗂️ الدورات السابقة</div><table>
      <tr><th>الدورة</th><th>مقرر الحفظ</th><th>الحضور</th><th>المستندات</th></tr>` +
      hist.map(h => `<tr><td>${toAr(h.cycle)}</td><td>${h.hifz ? esc(h.hifz) : '—'}</td><td>${h.att != null ? toAr(h.att) + '٪' : '—'}${h.star ? ' ' + esc(h.starEmoji || '⭐') : ''}</td><td>—</td></tr>`).join('') +
      `</table></div>`;
  }

  html += `<div class="card closing">سعدنا بوجودك معنا يا ${esc(first)} في هذه الدورة،<br>ونلقاك في الدورة القادمة بإذن الله 🤍</div>`;

  html += surveyDone
    ? `<div class="card"><div class="thanks">وصل رأيك، جزاك الله خيرًا 🤍</div></div>`
    : `<div class="card" id="surveyCard">
        <div class="sec-title" style="font-size:0.95rem;">💬 شاركينا رأيك</div>
        <div class="hint" style="margin-bottom:0.8rem;">الجزء الأول يوصل باسمك.</div>
        ${SURVEY.map(q => `<div class="q"><div class="qt">${q.title}</div><div class="opts">${q.opts.map(o => `<button type="button" class="opt" data-q="${q.id}" data-v="${o[0]}">${o[1]}</button>`).join('')}</div></div>`).join('')}
        <div class="q"><div class="qt">كلمتك عن الدورة (اختياري)</div><textarea id="svComment" maxlength="1000"></textarea></div>
        <div class="row-sep"></div>
        <div class="q"><div class="qt">اقتراح أو ملاحظة (اختياري)</div>
          <textarea id="svSugg" maxlength="2000"></textarea>
          <label class="chk"><input type="checkbox" id="svShowName"> اجعلي اسمي ظاهرًا مع اقتراحي</label>
          <div class="hint">لو ما حددتي الخيار، يوصل اقتراحك بدون اسم.</div>
        </div>
        <button class="btn" id="svBtn" type="button">إرسال</button>
        <div class="msg" id="svMsg"></div>
      </div>`;

  html += `<a class="store" href="${STORE_URL}" target="_blank" rel="noopener">🛒 متجر مداد الروح</a>` + footer();
  $('portal').innerHTML = html;

  document.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
    answers[b.dataset.q] = b.dataset.v;
    document.querySelectorAll('.opt[data-q="' + b.dataset.q + '"]').forEach(x => x.classList.toggle('on', x === b));
  }));
  const sb = $('svBtn');
  if (sb) sb.addEventListener('click', submitSurvey);
}

function footer() {
  return `<div class="foot">للتواصل: <a href="${WA_URL}" target="_blank" rel="noopener">واتساب مداد الروح</a></div>`;
}

async function submitSurvey() {
  const msg = $('svMsg');
  msg.style.color = 'var(--red)';
  if (!answers.overall || !answers.followup || !answers.load) { msg.textContent = 'اختاري إجابة لكل سؤال من الأسئلة الثلاثة'; return; }
  const btn = $('svBtn');
  btn.disabled = true; btn.textContent = '...';
  try {
    const r = await rpc('submit_survey', {
      p_code: currentCode,
      p_overall: answers.overall, p_followup: answers.followup, p_load: answers.load,
      p_comment: $('svComment').value, p_suggestion: $('svSugg').value,
      p_show_name: $('svShowName').checked,
    });
    if (r.status === 'ok' || r.status === 'already') {
      $('surveyCard').innerHTML = '<div class="thanks">' + (r.status === 'ok' ? 'وصل رأيك، جزاك الله خيرًا 🤍' : 'وصلنا رأيك سابقًا، جزاك الله خيرًا 🤍') + '</div>';
      return;
    }
    msg.textContent = r.status === 'locked' ? 'محاولات كثيرة، جرّبي بعد عشر دقائق.' : 'تعذّر الإرسال، حاولي مرة ثانية.';
  } catch (e) {
    msg.textContent = 'تعذّر الاتصال، حاولي مرة ثانية.';
  }
  btn.disabled = false; btn.textContent = 'إرسال';
}

$('loginBtn').addEventListener('click', login);
$('codeInput').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
</script>
</body>
</html>
